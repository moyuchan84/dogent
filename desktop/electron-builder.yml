# Dogent 데스크탑 실행본 (pnpm desktop:pack). 압축을 푼 폴더(release\win-unpacked\Dogent.exe)를 만든다.
# 한 파일 portable exe는 쓰지 않는다: 실행할 때마다 임시 폴더로 풀고 그 안의 앱을 다시 띄우는 껍데기라,
# 크롬이 Native Messaging 호스트로 띄우면 stdin/stdout이 안의 앱까지 이어지지 않아 확장과 연결되지 않는다.
# 앱 코드는 desktop/dist에 모두 묶여 있고 의존성이 없으므로, 그 폴더를 프로젝트로 삼아 만든다.
# 아래 경로는 desktop/dist 기준이다.
appId: com.dogent.desktop
productName: Dogent
directories:
  app: .
  output: ../release
files:
  - '**/*'
extraResources:
  # pnpm office:build로 만든 오피스 도구가 있으면 함께 넣는다.
  - from: ../../office/dist
    to: .
    filter:
      - dogent-office.exe
npmRebuild: false
asar: true
win:
  target: dir
  icon: ../../public/icon/256.png
