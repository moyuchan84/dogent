<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>홀드 Lot 찾기 - 모의 MES</title>
<style>
  body { font: 14px "Malgun Gothic", sans-serif; margin: 16px; color: #1c2733; }
  h1 { font-size: 16px; }
  table { border-collapse: collapse; }
  th, td { border: 1px solid #c9d2dc; padding: 5px 10px; text-align: left; }
  th { background: #eef2f6; }
</style>
</head>
<body>
<h1>홀드 Lot 찾기</h1>
<p>선택을 누르면 요청 화면에 입력되고 이 창은 닫힙니다.</p>
<!-- 행마다 같은 이름의 버튼이 있다. 에이전트는 행의 글자(row)로 어느 행인지 가린다. -->
<table>
  <caption>홀드 Lot</caption>
  <thead><tr><th>Lot ID</th><th>제품</th><th>공정</th><th>홀드 사유</th><th></th></tr></thead>
  <tbody>
    <tr><td>P7-00012</td><td>DR5-16G</td><td>PHOTO</td><td>검사 대기</td><td><button type="button" data-lot="P7-00012">선택</button></td></tr>
    <tr><td>P7-00031</td><td>NV2-512</td><td>ETCH</td><td>설비 점검</td><td><button type="button" data-lot="P7-00031">선택</button></td></tr>
    <tr><td>P8-00044</td><td>DR5-32G</td><td>CMP</td><td>품질 확인</td><td><button type="button" data-lot="P8-00044">선택</button></td></tr>
  </tbody>
</table>
<script>
  for (const a of document.querySelectorAll('button[data-lot]')) {
    a.addEventListener('click', () => {
      window.opener.setLot(a.dataset.lot);
      window.close();
    });
  }
</script>
</body>
</html>
